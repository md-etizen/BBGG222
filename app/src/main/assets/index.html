<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BillBubbles</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='0' y2='1'%3E%3Cstop offset='0' stop-color='%2354b8fa'/%3E%3Cstop offset='1' stop-color='%2399e67a'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='14' fill='url(%23g)'/%3E%3Ccircle cx='32' cy='32' r='21' fill='white' fill-opacity='.35' stroke='white' stroke-width='2.5'/%3E%3Ctext x='32' y='41' font-size='28' font-weight='800' text-anchor='middle' fill='%230d3d6b' font-family='Arial,sans-serif'%3E$%3C/text%3E%3C/svg%3E">
<style>
:root{
  /* theme colors (set from the Style menu) */
  --t-sky:#54b8fa; --t-aqua:#6be6ed; --t-grass:#99e67a;
  --t-ink:#0d3d6b; --t-soft:#1a5c8f; --t-bt:#73d9ff; --t-bb:#0d80d9; --t-sh:13,61,107;
  --sky:var(--t-sky); --aqua:var(--t-aqua); --grass:var(--t-grass);
  --ink:var(--t-ink); --ink-soft:var(--t-soft);
  --btn-top:var(--t-bt); --btn-bot:var(--t-bb); --sh:var(--t-sh);
  --orange:#f08a00; --green:#1fa65a;
  /* light mode surfaces */
  --w:255,255,255; --edge:#fff; --grid:rgba(var(--w),.7); --axis:rgba(var(--w),.95);
  --bgmix:100%; --sunA:.7; --up:#c25f00; --dn:#16804a; --err:#c0392b;
  --modal1:rgba(var(--w),.9); --modal2:rgba(235,250,255,.82);
  color-scheme:light;
}
/* dark mode surfaces */
html[data-mode=dark]{
  --ink:#eef5ff; --ink-soft:#b8cde6;
  --w:30,42,66; --edge:rgba(var(--w),.26); --grid:rgba(var(--w),.14); --axis:rgba(var(--w),.36);
  --bgmix:32%; --sunA:.1; --up:#ffb066; --dn:#6fe0a0; --err:#ff8f86;
  --orange:#ffa940; --green:#4cd98a;
  --modal1:rgba(32,46,72,.97); --modal2:rgba(22,33,54,.95);
  --sh:0,0,0; color-scheme:dark;
}
*{box-sizing:border-box}
html{min-height:100%;background:color-mix(in srgb,var(--grass) var(--bgmix),#000)}
body{
  margin:0; min-height:100vh; color:var(--ink);
  font-family:"Segoe UI Variable Display","Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
  background:linear-gradient(180deg,color-mix(in srgb,var(--sky) var(--bgmix),#000) 0%,color-mix(in srgb,var(--aqua) var(--bgmix),#000) 55%,color-mix(in srgb,var(--grass) var(--bgmix),#000) 100%) fixed;
  -webkit-font-smoothing:antialiased;
}
body::before{
  content:""; position:fixed; inset:0; pointer-events:none; z-index:0;
  background:radial-gradient(circle at 18% -5%,rgba(var(--w),var(--sunA)),rgba(var(--w),0) 55%);
}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--edge);outline-offset:2px;box-shadow:0 0 0 5px var(--btn-bot)}

/* floating bubbles */
.bubbles{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.bubble{
  position:absolute;border-radius:50%;
  background:radial-gradient(circle at 50% 50%,rgba(255,255,255,.06) 40%,rgba(255,255,255,.42) 100%);
  border:1.5px solid rgba(255,255,255,.75);
  animation:float var(--d,16s) ease-in-out infinite alternate;
}
.bubble::after{
  content:"";position:absolute;left:18%;top:11%;width:36%;height:20%;border-radius:50%;
  background:rgba(255,255,255,.7);filter:blur(1.5px);transform:rotate(-30deg);
}
@keyframes float{from{transform:translateY(0)}to{transform:translateY(-22px)}}
@media (prefers-reduced-motion:reduce){.bubble{animation:none}}

.app{position:relative;z-index:1;max-width:780px;margin:0 auto;padding:18px 16px 170px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:10px}
.brand h1{margin:0;font-size:1.7rem;font-weight:800;letter-spacing:-.01em;text-shadow:0 1px 0 rgba(var(--w),.7)}
.logo{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:1.2rem;
  background:radial-gradient(circle at 50% 40%,rgba(255,255,255,.2),rgba(255,255,255,.55));
  border:2px solid var(--edge);box-shadow:0 4px 10px rgba(var(--sh),.2)}

/* glass */
.glass{
  background:linear-gradient(180deg,rgba(var(--w),.66),rgba(var(--w),.24));
  -webkit-backdrop-filter:blur(14px) saturate(1.2);backdrop-filter:blur(14px) saturate(1.2);
  border:1.5px solid var(--edge);border-radius:28px;
  box-shadow:0 10px 28px rgba(var(--sh),.18),inset 0 1px 0 var(--edge);
}
.stack{display:grid;gap:18px}

/* glossy button */
.btn{
  position:relative;overflow:hidden;border:1.5px solid rgba(255,255,255,.85);border-radius:999px;
  padding:13px 28px;color:#fff;font-weight:700;font-size:1.02rem;text-shadow:0 1px 1px rgba(0,0,0,.28);
  background:linear-gradient(180deg,var(--btn-top),var(--btn-bot));
  box-shadow:0 8px 18px color-mix(in srgb,var(--btn-bot) 45%,transparent);transition:transform .15s,filter .15s;
}
.btn::before{content:"";position:absolute;left:4px;right:4px;top:3px;height:46%;border-radius:999px;
  background:linear-gradient(180deg,rgba(255,255,255,.78),rgba(255,255,255,.06));pointer-events:none}
.btn>*{position:relative}
.btn:hover{filter:brightness(1.06)}
.btn:active{transform:scale(.95)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.small{padding:9px 18px;font-size:.9rem}
.ibtn{
  width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:1.15rem;
  background:linear-gradient(180deg,rgba(var(--w),.95),rgba(var(--w),.4));
  border:1.5px solid var(--edge);box-shadow:0 5px 12px rgba(var(--sh),.22);color:var(--ink);
}
.ibtn:hover{filter:brightness(1.04)}
.ibtn:active{transform:scale(.93)}
.pill{
  border:1.5px solid var(--edge);border-radius:999px;padding:9px 18px;font-weight:700;font-size:.9rem;
  background:linear-gradient(180deg,rgba(var(--w),.9),rgba(var(--w),.45));
  box-shadow:0 4px 10px rgba(var(--sh),.18);
}

/* category bubble icon */
.cbub{
  --c:#409efa;--s:46px;position:relative;flex:none;width:var(--s);height:var(--s);border-radius:50%;display:grid;place-items:center;
  background:linear-gradient(180deg,color-mix(in srgb,var(--c) 70%,white),var(--c));
  border:1.5px solid rgba(255,255,255,.92);box-shadow:0 4px 9px color-mix(in srgb,var(--c) 55%,transparent);color:#fff;
}
.cbub::before{content:"";position:absolute;left:20%;right:20%;top:6%;height:28%;border-radius:50%;background:rgba(255,255,255,.55)}
.cbub svg{position:relative;width:46%;height:46%;filter:drop-shadow(0 1px 1px rgba(0,0,0,.28))}

/* month picker + total */
.monthbar{display:flex;align-items:center;justify-content:space-between}
.monthbar h2{margin:0;font-size:1.5rem;font-weight:800;text-shadow:0 1px 0 rgba(var(--w),.7)}
.total{padding:24px 18px;text-align:center;border-radius:36px}
.total .lbl{font-weight:600;color:var(--ink-soft)}
.total .amt{font-size:clamp(2.4rem,9vw,3.4rem);font-weight:800;line-height:1.15}
.diff{margin-top:4px;font-weight:700;font-size:.92rem}
.diff.up{color:var(--orange)} .diff.down{color:var(--green)}

.catgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.catbtn{display:flex;align-items:center;gap:12px;padding:12px;text-align:left;border-radius:26px;width:100%}
.catbtn:hover{transform:translateY(-2px)}
.catbtn{transition:transform .15s}
.catbtn .n{font-weight:700}
.catbtn .v{font-weight:600;font-size:.92rem;color:var(--ink-soft)}

h3.sec{margin:6px 0 -4px 6px;font-size:1.1rem;font-weight:800}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:24px;cursor:pointer}
.row:hover{transform:translateY(-1px)}
.row .mid{flex:1;min-width:0}
.row .name{font-weight:700}
.row .note{font-size:.85rem;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .amt{font-weight:800}
.row .x{width:34px;height:34px;border-radius:50%;border:0;background:rgba(var(--w),.55);color:var(--ink-soft);font-size:1.1rem;font-weight:700}
.row .x:hover{background:rgb(var(--w));color:var(--err)}
.empty{padding:28px 20px;text-align:center;color:var(--ink-soft);font-weight:600}
.empty .big{font-size:2.2rem;margin-bottom:6px}

/* insights */
h2.page{margin:6px 0 0 6px;font-size:2rem;font-weight:800;text-shadow:0 1px 0 rgba(var(--w),.7)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px}
.stat{padding:16px}
.stat .ic{width:34px;height:34px;margin-bottom:6px}
.stat .t{font-size:.8rem;font-weight:700;color:var(--ink-soft)}
.stat .v{font-size:1.4rem;font-weight:800;line-height:1.25}
.stat .s{font-size:.82rem;font-weight:600;color:var(--ink-soft)}
.card{padding:18px}
.card h3{margin:0 0 10px;font-size:1.1rem;font-weight:800}
.legend{display:flex;gap:16px;margin-top:6px;font-size:.82rem;font-weight:600;color:var(--ink-soft)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}
.barrow{margin-bottom:14px}
.barrow .hd{display:flex;align-items:center;gap:10px;margin-bottom:6px;font-weight:700}
.barrow .hd .sp{flex:1}
.track{height:12px;border-radius:999px;background:rgba(var(--w),.55)}
.fill{height:100%;min-width:12px;border-radius:999px;border:1px solid rgba(255,255,255,.85);
  background:linear-gradient(180deg,color-mix(in srgb,var(--c) 70%,white),var(--c))}
svg.chart{width:100%;height:auto;display:block}

/* due dates + calendar */
.row .note.due{color:var(--ink);font-weight:600}
.duerow{display:flex;gap:10px;align-items:center}
.field select{width:100%;border:0;background:transparent;outline:0;font:inherit;font-weight:700;color:inherit;cursor:pointer}
.field select:disabled{opacity:.5;cursor:not-allowed}
.donut{display:flex;flex-wrap:wrap;gap:18px;align-items:center;justify-content:center;margin-bottom:16px}
.donut svg{width:190px;height:190px;flex:none}
.dleg{flex:1;min-width:180px;display:grid;gap:8px}
.dleg div{display:flex;align-items:center;gap:8px;font-weight:700;font-size:.9rem}
.dleg i{width:12px;height:12px;border-radius:50%;flex:none;border:1.5px solid var(--edge)}
.dleg .sp{flex:1}
.dleg .pc{color:var(--ink-soft);min-width:44px;text-align:right}
.chg{display:flex;align-items:center;gap:10px;padding:8px 0;font-weight:700}
.chg+.chg{border-top:1px solid var(--grid)}
.chg .nm{flex:1}
.chg .up{color:var(--up)}.chg .dn{color:var(--dn)}.chg .eq{color:var(--ink-soft)}
.dtab{display:grid;grid-template-columns:1fr auto auto;gap:6px 14px;align-items:center;font-weight:700;font-size:.9rem}
.dtab .h{font-size:.75rem;color:var(--ink-soft);text-align:right}
.dtab .h:first-child{text-align:left}
.dtab .r{text-align:right}
.dtab .c{display:flex;align-items:center;gap:8px}
.dtab small{display:block;font-size:.72rem;color:var(--ink-soft);font-weight:600}
.flag{display:inline-block;margin-top:3px;padding:1px 9px;border-radius:999px;background:rgba(var(--w),.85);border:1px solid var(--edge);font-size:.75rem;font-weight:800}
.flag.up{color:var(--up)}.flag.dn{color:var(--dn)}
.tipi{display:flex;gap:12px;align-items:flex-start;padding:10px 0;font-weight:600;font-size:.92rem;line-height:1.4}
.tipi+.tipi{border-top:1px solid var(--grid)}
.tipi .tic{flex:none;width:34px;height:34px}
.tipi b{display:block;font-weight:800;margin-bottom:1px}
.tipi div span{color:var(--ink-soft)}
.alrt{display:flex;gap:12px;align-items:center;padding:8px 0;font-weight:700}
.alrt+.alrt{border-top:1px solid var(--grid)}
.alrt .nm{flex:1}
.alrt small{display:block;font-weight:600;color:var(--ink-soft)}
.rep{display:inline-block;margin-left:6px;padding:1px 8px;border-radius:999px;background:rgba(var(--w),.8);border:1px solid var(--edge);font-size:.72rem;font-weight:700;color:var(--ink-soft)}
.duerow input{flex:1;min-width:0;font-weight:700}
.amtrow input.dayin{width:58px;text-align:center;font-size:.9rem;font-weight:700;background:rgba(var(--w),.75);border-radius:12px;padding:6px 4px}
.cal{padding:14px}
.dow,.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dow span{text-align:center;font-size:.78rem;font-weight:800;color:var(--ink-soft);padding:2px 0 6px}
.day{min-height:56px;border-radius:18px;border:1.5px solid transparent;background:rgba(var(--w),.38);display:flex;flex-direction:column;align-items:center;gap:4px;padding:7px 2px 5px;font-weight:700;color:var(--ink);transition:transform .12s}
.day:hover{background:rgba(var(--w),.75);transform:translateY(-1px)}
.day.blank{background:transparent;border:0;pointer-events:none;min-height:0}
.day.today{border-color:var(--edge);box-shadow:inset 0 0 0 2px var(--btn-bot)}
.day.sel{color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.28);border-color:#fff;background:linear-gradient(180deg,var(--btn-top),var(--btn-bot));box-shadow:0 5px 12px color-mix(in srgb,var(--btn-bot) 40%,transparent)}
.dots{display:flex;gap:3px;justify-content:center;align-items:center;min-height:9px}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--c);border:1px solid rgba(255,255,255,.95)}
.dots b{font-size:.7rem;line-height:9px}
.day.sel .dots i{box-shadow:0 0 0 1.5px #fff}
.upnext{display:flex;align-items:center;gap:12px;width:100%;padding:10px 6px;border:0;background:transparent;text-align:left;border-radius:18px;border-top:1px solid var(--grid)}
.upnext:first-of-type{border-top:0}
.upnext:hover{background:rgba(var(--w),.55)}
.upnext .mid{flex:1;min-width:0}
.upnext small{color:var(--ink-soft);font-weight:600}
.upnext .when{font-size:.8rem;font-weight:800;padding:4px 10px;border-radius:999px;background:rgba(var(--w),.7);border:1px solid var(--edge)}
.upnext .amt{font-weight:800}

/* bottom tab bar + add */
.tabbar{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:5;display:flex;gap:6px;padding:6px;border-radius:40px}
.tab{border:0;background:transparent;display:flex;align-items:center;gap:8px;padding:11px 24px;border-radius:999px;font-weight:700;color:var(--ink)}
.tab svg{width:18px;height:18px}
.tab.on{color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.25);border:1.5px solid rgba(255,255,255,.8);
  background:linear-gradient(180deg,var(--btn-top),var(--btn-bot));box-shadow:0 5px 12px color-mix(in srgb,var(--btn-bot) 45%,transparent)}
.addwrap{position:fixed;z-index:6;right:max(16px,calc(50% - 374px));bottom:86px;display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.addmenu{padding:8px;display:grid;gap:4px;min-width:240px}
.addmenu button{border:0;background:transparent;text-align:left;padding:12px 14px;border-radius:18px;font-weight:700;display:flex;gap:10px;align-items:center}
.addmenu button:hover{background:rgba(var(--w),.75)}

/* modal */
.overlay{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:16px;background:rgba(var(--sh),.38);
  -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.modal{width:100%;max-width:560px;max-height:92vh;overflow:auto;padding:20px;background:linear-gradient(180deg,var(--modal1),var(--modal2))}
.mhead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px}
.mhead h2{margin:0;font-size:1.6rem;font-weight:800}
.mhead p{margin:2px 0 0;font-weight:600;color:var(--ink-soft)}
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.chip{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 6px;font-weight:700;font-size:.85rem;
  border:3px solid transparent;border-radius:22px;background:linear-gradient(180deg,rgba(var(--w),.85),rgba(var(--w),.45));
  box-shadow:0 4px 10px rgba(var(--sh),.14);transition:transform .15s}
.chip.on{border-color:var(--c);transform:scale(1.04)}
.mchip{padding:10px 4px;border-radius:999px;font-weight:700;font-size:.9rem;border:1.5px solid var(--edge);
  background:rgba(var(--w),.55);transition:transform .15s}
.mchip.on{color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.25);background:linear-gradient(180deg,var(--btn-top),var(--btn-bot));transform:scale(1.04)}
.field{display:block;margin-bottom:14px;padding:14px 16px;border-radius:24px;background:rgba(var(--w),.65);border:1.5px solid var(--edge)}
.field span.l{display:block;font-weight:700;font-size:.85rem;color:var(--ink-soft);margin-bottom:4px}
.field input{width:100%;border:0;background:transparent;outline:0;font-weight:700}
.field input.big{font-size:2rem;font-weight:800}
.field:focus-within{box-shadow:0 0 0 3px var(--btn-bot)}
.err{color:var(--err);font-weight:700;margin:-6px 0 12px 6px;font-size:.9rem}
.quick{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.quick .pill{padding:7px 14px;font-size:.82rem}
.sub{margin:0 0 10px;font-weight:800;font-size:1.05rem}
.hint{margin:-6px 0 10px;font-size:.85rem;font-weight:600;color:var(--ink-soft)}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}
.amtrow{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:20px;background:rgba(var(--w),.55);margin-bottom:8px}
.amtrow .nm{font-weight:700;flex:1}
.amtrow input{width:120px;border:0;background:transparent;outline:0;text-align:right;font-size:1.15rem;font-weight:800}
.amtrow:focus-within{box-shadow:0 0 0 3px var(--btn-bot)}
.amtrow.notefield input{width:100%;text-align:left;font-size:.9rem;font-weight:600}
.switch{display:flex;gap:12px;align-items:center;padding:14px 16px;border-radius:22px;background:rgba(var(--w),.65);border:1.5px solid var(--edge);margin:6px 0 14px;cursor:pointer}
.switch input{width:22px;height:22px;accent-color:var(--btn-bot);flex:none}
.switch b{display:block}
.switch small{color:var(--ink-soft);font-weight:600}
.summary{text-align:center;font-weight:700;margin:10px 0 14px}
.center{display:flex;justify-content:center}
.banner{padding:12px 16px;border-radius:20px;background:#fff3cd;border:1.5px solid #ffe08a;font-weight:600;margin-bottom:14px;color:#6b4e00}
.note-p{font-weight:600;color:var(--ink-soft);margin:0 0 14px}
.backups{display:grid;gap:12px}
input[type=file]{display:none}

.field input:focus-visible,.amtrow input:focus-visible{outline:0;box-shadow:none}

@media (max-width:600px){
  .catgrid{grid-template-columns:repeat(2,1fr);gap:12px}
  .catbtn{padding:10px;gap:10px}
  .catbtn .cbub{--s:40px!important}
  .catbtn .n{font-size:.95rem}
  .catbtn .v{font-size:.85rem}
}
@media (max-width:520px){
  .tab{padding:10px 12px;font-size:.92rem;gap:6px}
  .tab svg{width:16px;height:16px}
  .amtrow{gap:8px;padding:10px}
  .amtrow input{width:86px}
  .amtrow input.dayin{width:46px}
  .day{min-height:50px;border-radius:14px}
  .day.tipday{min-height:62px}
  .tipday .ta2{font-size:.68rem}
  .tipday .tr{font-size:.6rem}
  .dow,.days{gap:4px}
  .addwrap{right:16px}
  .brand h1{font-size:1.45rem}
}

svg text.tv{fill:var(--ink)}
svg text.ta{fill:var(--ink-soft)}
.foot{text-align:center;padding:18px 0 110px}
.linkbtn{background:none;border:0;color:var(--ink-soft);font:inherit;font-weight:700;font-size:.9rem;text-decoration:underline;cursor:pointer}
.policy h4{margin:18px 0 4px;font-size:1.02rem}
.policy p{margin:0 0 6px;line-height:1.55}
.policy .sum{font-size:1.05rem}
.remind{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:22px;margin-bottom:14px;background:rgba(var(--w),.7);border:1.5px solid var(--edge);box-shadow:0 6px 18px rgba(0,0,0,.08)}
.remind .rb{flex:1;min-width:0}
.remind b{display:block;font-size:1rem}
.remind span.s{font-size:.9rem;font-weight:600;color:var(--ink-soft)}
.remind .x{width:34px;height:34px;border-radius:50%;border:0;background:rgba(var(--w),.55);color:var(--ink-soft);font-size:1.1rem;font-weight:700;cursor:pointer}
.chk{display:flex;align-items:center;gap:10px;margin:12px 4px;font-weight:700;cursor:pointer}
.chk input{width:20px;height:20px}
/* tips tab */
.day.tipday{min-height:68px;justify-content:flex-start;gap:2px;padding:6px 1px 4px}
.tipday .dn{font-size:.95rem}
.tipday .ta2{font-size:.74rem;font-weight:800;line-height:1.1;margin-top:2px}
.tipday .tr{font-size:.66rem;font-weight:700;line-height:1.1;color:var(--ink-soft)}
.day.sel .tr{color:rgba(255,255,255,.92)}
.tipday.has{background:rgba(var(--w),.62)}
.day.sel.has{background:linear-gradient(180deg,var(--btn-top),var(--btn-bot))}
.tiprow{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:22px;cursor:pointer;background:rgba(var(--w),.45);border:1.5px solid var(--edge)}
.tiprow+.tiprow{margin-top:8px}
.tiprow .mid{flex:1;min-width:0}
.tiprow .big{font-weight:800;font-size:1.15rem}
.tiprow .sub2{font-size:.85rem;font-weight:600;color:var(--ink-soft)}
.tiprow .rate{font-weight:800;text-align:right}
.tiprow .rate small{display:block;font-size:.72rem;color:var(--ink-soft);font-weight:700}
.tiprow .x{width:34px;height:34px;border-radius:50%;border:0;background:rgba(var(--w),.55);color:var(--ink-soft);font-size:1.1rem;font-weight:700}
.tiprow .x:hover{background:rgb(var(--w));color:var(--err)}
.calc{margin:-4px 0 14px 6px;font-weight:800}
.dayline{margin:10px 2px 0;font-weight:700;font-size:.92rem}
@media (max-width:430px){.tab:not(.on) .tl{display:none}.tab:not(.on){padding:10px 14px}}
/* icon picker */
.ipv{display:flex;align-items:center;gap:14px;margin:4px 0 10px;flex-wrap:wrap}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatches button{width:28px;height:28px;border-radius:50%;border:2px solid var(--edge);background:var(--c);padding:0;position:relative}
.swatches button.on{box-shadow:0 0 0 3px var(--btn-bot);transform:scale(1.1)}
.swatches .sw0{background:rgba(var(--w),.8);display:grid;place-items:center}
.swatches .sw0 i{width:12px;height:12px;border-radius:50%;display:block;border:1.5px solid #fff}
.iconpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:8px;max-height:210px;overflow:auto;padding:4px 2px 4px 4px}
.ipick{height:46px;border-radius:14px;border:2px solid transparent;background:rgba(var(--w),.55);display:grid;place-items:center;padding:0;color:var(--ink)}
.ipick svg{width:24px;height:24px;fill:currentColor}
.ipick:hover{background:rgba(var(--w),.85)}
.ipick.on{border-color:var(--btn-bot);background:rgba(var(--w),.9);transform:scale(1.06)}
/* style menu */
.hdr{display:flex;gap:8px;align-items:center}
.hdr .pill{white-space:nowrap}
@media (max-width:420px){.hdr .pill{padding:8px 13px}.brand h1{font-size:1.45rem}}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}
.mode{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 6px;border-radius:20px;font-weight:700;border:1.5px solid var(--edge);background:rgba(var(--w),.8);transition:transform .15s}
.mode .g{font-size:1.4rem;line-height:1}
.mode.on{color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.25);background:linear-gradient(180deg,var(--btn-top),var(--btn-bot));transform:scale(1.03)}
.themes{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:18px}
.theme{display:flex;flex-direction:column;gap:8px;align-items:stretch;padding:10px;border-radius:24px;border:3px solid transparent;background:rgba(var(--w),.45);font-weight:700;text-align:center}
.theme.on{border-color:var(--btn-bot);background:rgba(var(--w),.7)}
.theme .sw{position:relative;display:block;height:64px;border-radius:16px;border:1.5px solid var(--edge)}
.theme .sw i{position:absolute;left:50%;top:50%;width:46px;height:20px;margin:-10px 0 0 -23px;border-radius:999px;border:1px solid rgba(255,255,255,.85)}
.theme .ck{position:absolute;right:6px;top:4px;color:#fff;font-weight:800;text-shadow:0 1px 2px rgba(0,0,0,.45)}
</style>

function money(n){return moneyFmt.format(n)}
function money0(n){return money0Fmt.format(n)}

/* ---------- helpers ---------- */
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function pad(n){return String(n).padStart(2,'0')}
function curYM(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)}
function addM(m,n){var p=m.split('-').map(Number);var d=new Date(p[0],p[1]-1+n,1);return d.getFullYear()+'-'+pad(d.getMonth()+1)}
function mDate(m){var p=m.split('-').map(Number);return new Date(p[0],p[1]-1,1)}
function mTitle(m){return mDate(m).toLocaleDateString(undefined,{month:'long',year:'numeric'})}
function mShortYear(m){return mDate(m).toLocaleDateString(undefined,{month:'short',year:'numeric'})}
function mShort(m){return mDate(m).toLocaleDateString(undefined,{month:'short'})}
function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function todayStr(){return ymd(new Date())}
function dDate(s){var p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2])}
function dShort(s){return dDate(s).toLocaleDateString(undefined,{month:'short',day:'numeric'})}
function dLong(s){return dDate(s).toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'})}
function daysIn(m){var p=m.split('-').map(Number);return new Date(p[0],p[1],0).getDate()}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function parseAmt(s){var n=parseFloat(String(s||'').replace(',','.'));return isFinite(n)?n:0}
var DUE_RE=/^\d{4}-\d{2}-\d{2}$/;
var REPEATS={weekly:'Weekly',biweekly:'Every 2 weeks',monthly:'Monthly',yearly:'Yearly'};
function repOK(r){return Object.prototype.hasOwnProperty.call(REPEATS,r)}
/* Dates a bill falls due in month m (YYYY-MM). A repeating bill starts on its due date. */
function occurrencesIn(b,m){
  if(!b.due)return [];
  if(!b.repeat)return b.due.slice(0,7)===m?[b.due]:[];
  var n=daysIn(m),first=m+'-01',last=m+'-'+pad(n),out=[],i,ds;
  if(b.due>last)return out;
  if(b.repeat==='weekly'||b.repeat==='biweekly'){
    var step=b.repeat==='weekly'?7:14,s=dDate(b.due),f=dDate(first);
    var k=s<f?Math.ceil(Math.round((f-s)/864e5)/step):0;
    for(var d=new Date(s.getFullYear(),s.getMonth(),s.getDate()+k*step);ymd(d)<=last;d=new Date(d.getFullYear(),d.getMonth(),d.getDate()+step))out.push(ymd(d));
  }else if(b.repeat==='monthly'){
    ds=m+'-'+pad(Math.min(+b.due.slice(8),n));if(ds>=b.due)out.push(ds);
  }else if(b.repeat==='yearly'){
    if(b.due.slice(5,7)===m.slice(5,7)){ds=m+'-'+pad(Math.min(+b.due.slice(8),n));if(ds>=b.due)out.push(ds)}
  }
  return out;
}
/* Next date on or after day 'from' that the bill is due, or '' */
function nextDue(b,from){
  if(!b.due)return '';
  if(!b.repeat)return b.due>=from?b.due:'';
  var m=from.slice(0,7);
  for(var i=0;i<=13;i++){
    var o=occurrencesIn(b,m).filter(function(x){return x>=from});
    if(o.length)return o[0];
    m=addM(m,1);
  }
  return '';
}
function validBill(b){return b&&CAT_IDS.indexOf(b.category)>=0&&typeof b.amount==='number'&&isFinite(b.amount)&&/^\d{4}-\d{2}$/.test(b.month)&&(!b.due||DUE_RE.test(b.due))&&(!b.repeat||(repOK(b.repeat)&&!!b.due))&&(b.name==null||typeof b.name==='string')&&(!b.icon||!!iconPath(b.icon))&&(!b.color||colorOK(b.color))}
function clean(b){var o={id:b.id||uid(),category:b.category,amount:b.amount,note:b.note||'',month:b.month};
  var nm=typeof b.name==='string'?b.name.trim().slice(0,40):'';if(nm)o.name=nm;if(b.icon&&iconPath(b.icon))o.icon=b.icon;if(colorOK(b.color))o.color=b.color.toLowerCase();
  if(b.due&&DUE_RE.test(b.due)){o.due=b.due;if(repOK(b.repeat))o.repeat=b.repeat}return o}
function icon(id,size){var c=cat(id);return iconHTML(c.icon,c.color,size)}

/* ---------- storage ---------- */
var storageOk=true;
function load(){
  try{
    var raw=localStorage.getItem(KEY);
    if(!raw)return [];
    var a=JSON.parse(raw);
    if(!Array.isArray(a))return [];
    return a.filter(validBill).map(clean);
  }catch(e){
    try{var r=localStorage.getItem(KEY);if(r)localStorage.setItem(KEY+'.unreadable',r)}catch(e2){}
    storageOk=false;return [];
  }
}
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(bills))}catch(e){storageOk=false}
  renderBanner();
}
var bills=load();

/* ---------- calculations ---------- */
function billsIn(m){return bills.filter(function(b){return b.month===m}).sort(function(a,b){return a.category.localeCompare(b.category)})}
function totalIn(m){return billsIn(m).reduce(function(s,b){return s+b.amount},0)}
function totalFor(c,m){return billsIn(m).filter(function(b){return b.category===c}).reduce(function(s,b){return s+b.amount},0)}
function monthlyTotals(){
  var map={};bills.forEach(function(b){map[b.month]=(map[b.month]||0)+b.amount});
  return Object.keys(map).sort().map(function(m){return {month:m,total:map[m]}});
}
function extreme(rows,dir){
  var best=null;rows.forEach(function(r){if(!best||(dir>0?r.total>best.total:r.total<best.total))best=r});return best;
}
function categoryTotals(){
  return CATS.map(function(c){return {cat:c.id,total:bills.filter(function(b){return b.category===c.id}).reduce(function(s,b){return s+b.amount},0)}})
    .filter(function(x){return x.total>0}).sort(function(a,b){return b.total-a.total});
}
function changeFor(m){
  var cur=totalIn(m),prev=totalIn(addM(m,-1));
  if(!(cur>0&&prev>0))return null;
  var d=cur-prev;return Math.abs(d)<0.005?null:d;
}

/* ---------- state ---------- */
var state={tab:'bills',month:curYM(),menu:false,cal:curYM(),sel:todayStr(),tcal:curYM(),tsel:todayStr()};
var modal=null;

/* ---------- rendering ---------- */
var $view=document.getElementById('view');
var $add=document.getElementById('addroot');
var $modal=document.getElementById('modalroot');

function renderBanner(){
  document.getElementById('banner').innerHTML=reminderBanner()+(storageOk?'':'<div class="banner">Your browser is blocking saving, so changes will be lost when you close this page. Use <b>Backup</b> to save a copy.</div>');
}

function render(){
  document.getElementById('tab-tips').classList.toggle('on',state.tab==='tips');
  document.getElementById('tab-bills').classList.toggle('on',state.tab==='bills');
  document.getElementById('tab-calendar').classList.toggle('on',state.tab==='calendar');
  document.getElementById('tab-insights').classList.toggle('on',state.tab==='insights');
  renderBanner();
  $view.innerHTML=state.tab==='bills'?billsView():state.tab==='calendar'?calendarView():state.tab==='tips'?tipsView():insightsView();
  $add.innerHTML=state.tab==='bills'?addControl():'';
  renderBanner();
}

function addControl(){
  return '<div class="addwrap">'+
    (state.menu?'<div class="addmenu glass" role="menu">'+
      '<button role="menuitem" data-act="add-one">+ Add one bill</button>'+
      '<button role="menuitem" data-act="add-many">&#128197; Add many months at once</button></div>':'')+
    '<button class="btn" data-act="toggle-menu" aria-haspopup="menu" aria-expanded="'+state.menu+'"><span>+ Add</span></button></div>';
}

function billsView(){
  var m=state.month,items=billsIn(m),diff=changeFor(m);
  var h='<section class="stack">';
  h+='<div class="monthbar"><button class="ibtn" data-act="prev" aria-label="Previous month">&#8249;</button><h2>'+esc(mTitle(m))+'</h2><button class="ibtn" data-act="next" aria-label="Next month">&#8250;</button></div>';
  h+='<div class="glass total"><div class="lbl">Total this month</div><div class="amt">'+money(totalIn(m))+'</div>';
  if(diff!==null)h+='<div class="diff '+(diff>0?'up':'down')+'">'+(diff>0?'&#8599; ':'&#8600; ')+money(Math.abs(diff))+' '+(diff>0?'more':'less')+' than last month</div>';
  h+='</div>';
  h+='<div class="catgrid">'+CATS.map(function(c){
    return '<button class="glass catbtn" data-act="add-one" data-cat="'+c.id+'">'+icon(c.id,46)+'<span><span class="n" style="display:block">'+c.id+'</span><span class="v">'+money(totalFor(c.id,m))+'</span></span></button>';
  }).join('')+'</div>';
  h+='<h3 class="sec">Bills this month</h3>';
  if(!items.length){
    h+='<div class="glass empty"><div class="big">&#10024;</div>No bills yet. Tap a bubble above or press Add!</div>';
  }else{
    h+=items.map(function(b){return rowHTML(b,false)}).join('');
  }
  return h+'</section>';
}

function rowHTML(b,hideDue){
  return '<div class="glass row" data-act="edit" data-id="'+esc(b.id)+'">'+billIcon(b,40)+
    '<div class="mid"><div class="name">'+esc(billName(b))+(b.repeat?'<span class="rep">&#128257; '+REPEATS[b.repeat]+'</span>':'')+'</div>'+(billNote(b)?'<div class="note">'+esc(billNote(b))+'</div>':'')+
    (!hideDue?flagHTML(b):'')+(b.due&&!hideDue?'<div class="note due">&#128197; '+(b.repeat?'Starts ':'Due ')+esc(dShort(b.due))+'</div>':'')+'</div>'+
    '<div class="amt">'+money(b.amount)+'</div>'+
    '<button class="x" data-act="delete" data-id="'+esc(b.id)+'" aria-label="Delete '+esc(billName(b))+' bill">&#10005;</button></div>';
}

function billsDueOn(ds){return bills.filter(function(b){return occurrencesIn(b,ds.slice(0,7)).indexOf(ds)>=0})}

function calendarView(){
  var m=state.cal,offset=mDate(m).getDay(),n=daysIn(m),today=todayStr();
  var byDay={},monthCount=0,monthSum=0;
  bills.forEach(function(b){occurrencesIn(b,m).forEach(function(ds){(byDay[ds]=byDay[ds]||[]).push(b);monthCount++;monthSum+=b.amount})});
  var h='<section class="stack">';
  h+='<div class="monthbar"><button class="ibtn" data-act="cal-prev" aria-label="Previous month">&#8249;</button><h2>'+esc(mTitle(m))+'</h2><button class="ibtn" data-act="cal-next" aria-label="Next month">&#8250;</button></div>';
  h+='<div class="glass cal"><div class="dow">'+['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(function(d){return '<span>'+d+'</span>'}).join('')+'</div><div class="days">';
  for(var i=0;i<offset;i++)h+='<div class="day blank"></div>';
  for(var d=1;d<=n;d++){
    var ds=m+'-'+pad(d),list=byDay[ds]||[];
    var cats=[];list.forEach(function(b){if(cats.indexOf(b.category)<0)cats.push(b.category)});
    var dots=cats.slice(0,3).map(function(c){return '<i style="--c:'+cat(c).color+'"></i>'}).join('')+(cats.length>3?'<b>+</b>':'');
    h+='<button class="day'+(ds===today?' today':'')+(ds===state.sel?' sel':'')+'" data-act="cal-day" data-d="'+ds+'" aria-pressed="'+(ds===state.sel)+'" aria-label="'+esc(dLong(ds))+(list.length?', '+list.length+(list.length===1?' bill':' bills')+' due':'')+'"><span>'+d+'</span><span class="dots">'+dots+'</span></button>';
  }
  h+='</div></div>';
  h+='<div class="legend" style="margin:-6px 0 0 6px;color:var(--ink)">'+(monthCount?monthCount+(monthCount===1?' bill':' bills')+' due in '+esc(mTitle(m))+' ('+money(monthSum)+')':'No bills due in '+esc(mTitle(m))+' yet')+'</div>';
  var sel=billsDueOn(state.sel);
  h+='<div class="glass card"><h3>'+esc(dLong(state.sel))+'</h3>'+
    (sel.length?sel.map(function(b){return rowHTML(b,true)}).join('<div style="height:8px"></div>'):'<p class="note-p" style="margin:0 0 12px">Nothing due this day.</p>')+
    '<div class="center" style="margin-top:12px"><button class="btn small" data-act="cal-add"><span>+ Add bill due this day</span></button></div></div>';
  var up=bills.map(function(b){return {b:b,d:nextDue(b,today)}}).filter(function(x){return x.d}).sort(function(a,b){return a.d<b.d?-1:a.d>b.d?1:0}).slice(0,5);
  h+='<div class="glass card"><h3>Coming up</h3>'+(up.length?up.map(function(x){
    var b=x.b;
    return '<button class="upnext" data-act="cal-goto" data-d="'+x.d+'">'+billIcon(b,34)+'<span class="mid"><b>'+esc(billName(b))+'</b>'+(billNote(b)?' <small>'+esc(billNote(b))+'</small>':'')+(b.repeat?'<span class="rep">&#128257; '+REPEATS[b.repeat]+'</span>':'')+'</span><span class="when">'+esc(x.d===today?'Today':dShort(x.d))+'</span><span class="amt">'+money(b.amount)+'</span></button>';
  }).join(''):'<p class="note-p" style="margin:0">No upcoming due dates yet. Add a due date when you enter a bill.</p>')+'</div>';
  return h+'</section>';
}


/* ---------- tips tab: tips and hours per day, with the hourly rate ---------- */
var TIPS_KEY='billbubbles.tips.v1';
function validTip(t){return t&&DUE_RE.test(t.date||'')&&typeof t.amount==='number'&&isFinite(t.amount)&&t.amount>=0&&typeof t.hours==='number'&&isFinite(t.hours)&&t.hours>0&&t.hours<=24}
function cleanTip(t){return {id:t.id||uid(),date:t.date,amount:Math.round(t.amount*100)/100,hours:Math.round(t.hours*100)/100,note:typeof t.note==='string'?t.note.slice(0,80):''}}
function loadTips(){try{var a=JSON.parse(localStorage.getItem(TIPS_KEY)||'[]');return Array.isArray(a)?a.filter(validTip).map(cleanTip):[]}catch(e){return []}}
var tips=loadTips();
function saveTips(){try{localStorage.setItem(TIPS_KEY,JSON.stringify(tips))}catch(e){storageOk=false}renderBanner()}
var CUR=(function(){try{var p=moneyFmt.formatToParts(0).filter(function(x){return x.type==='currency'})[0];return p?p.value:'$'}catch(e){return '$'}})();
function parseHours(s){
  s=String(s||'').trim();if(!s)return NaN;
  var m=s.match(/^(\d{1,2}):([0-5]\d)$/);if(m)return +m[1]+ +m[2]/60;
  if(!/^\d*[.,]?\d+$/.test(s)&&!/^\d+[.,]$/.test(s))return NaN;
  var n=parseFloat(s.replace(',','.'));return isFinite(n)?n:NaN;
}
function fmtHours(h){var t=Math.round(h*60),hh=Math.floor(t/60),mm=t%60;return mm?(hh?hh+' h ':'')+mm+' min':hh+' h'}
function cAmt(n){return n>=1000?CUR+(n/1000).toFixed(1).replace(/\.0$/,'')+'k':CUR+(n%1===0?n:n.toFixed(2))}
function cRate(r){return CUR+(r>=100?Math.round(r):r.toFixed(1).replace(/\.0$/,''))+'/h'}
function tipsOn(ds){return tips.filter(function(t){return t.date===ds})}
function tipTotals(list){var a=0,h=0;list.forEach(function(t){a+=t.amount;h+=t.hours});return {amt:a,hrs:h,rate:h>0?a/h:0,n:list.length}}
function tipsIn(m){return tips.filter(function(t){return t.date.slice(0,7)===m})}
function tipsView(){
  var m=state.tcal,offset=mDate(m).getDay(),n=daysIn(m),today=todayStr(),byDay={};
  tipsIn(m).forEach(function(t){(byDay[t.date]=byDay[t.date]||[]).push(t)});
  var h='<section class="stack">';
  h+='<div class="monthbar"><button class="ibtn" data-act="tip-prev" aria-label="Previous month">&#8249;</button><h2>'+esc(mTitle(m))+'</h2><button class="ibtn" data-act="tip-next" aria-label="Next month">&#8250;</button></div>';
  h+='<div class="glass cal"><div class="dow">'+['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(function(d){return '<span>'+d+'</span>'}).join('')+'</div><div class="days">';
  for(var i=0;i<offset;i++)h+='<div class="day blank"></div>';
  for(var d=1;d<=n;d++){
    var ds=m+'-'+pad(d),list=byDay[ds]||[],tt=tipTotals(list),has=list.length>0;
    h+='<button class="day tipday'+(has?' has':'')+(ds===today?' today':'')+(ds===state.tsel?' sel':'')+'" data-act="tip-day" data-d="'+ds+'" aria-pressed="'+(ds===state.tsel)+'" aria-label="'+esc(dLong(ds))+(has?', '+money(tt.amt)+' in tips over '+fmtHours(tt.hrs)+', '+money(tt.rate)+' per hour':', no tips entered')+'"><span class="dn">'+d+'</span>'+
      (has?'<span class="ta2">'+cAmt(tt.amt)+'</span><span class="tr">'+cRate(tt.rate)+'</span>':'')+'</button>';
  }
  h+='</div></div>';
  var mt=tipTotals(tipsIn(m)),days=Object.keys(byDay).length,best=null;
  Object.keys(byDay).forEach(function(k){var x=tipTotals(byDay[k]);if(!best||x.rate>best.rate)best={d:k,rate:x.rate}});
  h+='<div class="stats">'+
    stat(sIcon('var(--green)','M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm1 5v1.1c1.2.2 2 .9 2.4 1.9l-1.7.7c-.2-.6-.8-1-1.7-1-1 0-1.5.4-1.5 1 0 .7.6.9 2 1.3 1.8.5 3 1.2 3 2.9 0 1.3-1 2.3-2.5 2.6V18h-2v-1.1c-1.3-.2-2.3-1-2.7-2.2l1.7-.7c.3.8 1 1.3 2 1.3 1 0 1.6-.4 1.6-1 0-.7-.6-.9-2.1-1.3-1.7-.5-2.9-1.2-2.9-2.9 0-1.2.9-2.1 2.4-2.4V7z'),'Tips This Month',money(mt.amt),days+(days===1?' day':' days')+' worked')+
    stat(sIcon('var(--btn-bot)','M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm.5 5v5.2l4 2.4-.8 1.3-4.7-2.8V7z'),'Hours Worked',mt.hrs?fmtHours(mt.hrs):'0 h',mt.n+(mt.n===1?' shift':' shifts'))+
    stat(sIcon('var(--orange)','M5 17l4-4 3 3 6-7 1.5 1.3L12 19l-3-3-3.5 3.5z'),'Hourly Rate',mt.hrs?money(mt.rate)+'/h':'—','Tips divided by hours')+
    stat(sIcon('var(--btn-bot)','M12 2l2.9 6.9 7.1.6-5.4 4.7 1.6 7.1L12 17.8 5.8 21.3l1.6-7.1L2 9.5l7.1-.6z'),'Best Day',best?money(best.rate)+'/h':'—',best?dShort(best.d):'Add tips to see it')+'</div>';
  var sel=tipsOn(state.tsel),st=tipTotals(sel);
  h+='<div class="glass card"><h3>'+esc(dLong(state.tsel))+'</h3>'+
    (sel.length?sel.map(function(t){
      return '<div class="tiprow" data-act="tip-edit" data-id="'+esc(t.id)+'"><div class="mid"><div class="big">'+money(t.amount)+'</div><div class="sub2">'+fmtHours(t.hours)+(t.note?' · '+esc(t.note):'')+'</div></div><div class="rate">'+money(t.amount/t.hours)+'<small>per hour</small></div><button class="x" data-act="tip-delete" data-id="'+esc(t.id)+'" aria-label="Delete these tips">&#10005;</button></div>';
    }).join('')+(sel.length>1?'<div class="dayline">Day total: '+money(st.amt)+' over '+fmtHours(st.hrs)+' = '+money(st.rate)+' per hour</div>':''):'<p class="note-p" style="margin:0 0 12px">No tips entered for this day.</p>')+
    '<div class="center" style="margin-top:12px"><button class="btn small" data-act="tip-add"><span>+ Add tips and hours</span></button></div></div>';
  return h+'</section>';
}
function openTip(editId,date){
  var t=editId?tips.filter(function(x){return x.id===editId})[0]:null;
  modal={type:'tip',editId:editId||null,date:t?t.date:(date||state.tsel),amount:t?String(t.amount):'',hours:t?String(t.hours):'',note:t?t.note:''};
  $modal.innerHTML=shell(head(t?'Edit Tips':'Add Tips','Enter what you made and the hours you worked')+
    '<label class="field"><span class="l">Tips earned</span><input class="big" id="f-tamt" inputmode="decimal" autocomplete="off" placeholder="0.00" value="'+esc(modal.amount)+'"></label>'+
    '<label class="field"><span class="l">Hours worked (like 5.5 or 5:30)</span><input id="f-thrs" inputmode="decimal" autocomplete="off" placeholder="0" value="'+esc(modal.hours)+'"></label>'+
    '<div class="calc" id="f-tcalc" aria-live="polite"></div>'+
    '<div class="err" id="f-terr" hidden></div>'+
    '<label class="field"><span class="l">Date</span><input type="date" id="f-tdate" value="'+esc(modal.date)+'"></label>'+
    '<label class="field"><span class="l">Note (optional)</span><input id="f-tnote" maxlength="80" autocomplete="off" placeholder="e.g. Double shift" value="'+esc(modal.note)+'"></label>'+
    '<div class="center"><button class="btn" data-act="save-tip"><span>'+(t?'Save Changes':'Save Tips')+'</span></button></div>','Tips');
  updateTipCalc();document.getElementById('f-tamt').focus();
}
function updateTipCalc(){
  var a=parseAmt(modal.amount),hr=parseHours(modal.hours),el=document.getElementById('f-tcalc');if(!el)return;
  el.textContent=(modal.amount!==''&&hr>0&&isFinite(a))?'= '+money(a/hr)+' per hour':'';
}
function saveTip(){
  var errEl=document.getElementById('f-terr'),a=parseAmt(modal.amount),hr=parseHours(modal.hours),msg='';
  if(String(modal.amount).trim()===''||!(a>=0))msg='Enter the tips you earned (0 or more).';
  else if(!(hr>0))msg='Enter the hours you worked, like 5.5 or 5:30.';
  else if(hr>24)msg='Hours must be 24 or less.';
  else if(!DUE_RE.test(modal.date||''))msg='Pick a date.';
  if(msg){errEl.textContent=msg;errEl.hidden=false;return}
  var rec=cleanTip({id:modal.editId||uid(),date:modal.date,amount:a,hours:hr,note:(modal.note||'').trim()});
  if(modal.editId)tips=tips.map(function(x){return x.id===modal.editId?rec:x});else tips.push(rec);
  state.tsel=rec.date;state.tcal=rec.date.slice(0,7);
  saveTips();closeModal();render();
}

function insightsView(){
  var rows=monthlyTotals();
  var h='<section class="stack"><h2 class="page">Insights</h2>';

  if(!(tot>0))return '<div class="glass card"><h3>When bills are due</h3><p class="note-p" style="margin:0">Add due dates to your bills to see which part of the month is heaviest.</p></div>';
  var mx=Math.max.apply(null,B.map(function(x){return x.v}));
  return '<div class="glass card"><h3>When bills are due</h3><p class="note-p" style="margin:0 0 10px">'+esc(mTitle(f))+', by week</p>'+B.map(function(x){
    return '<div class="barrow"><div class="hd"><span>'+x.l+'</span><span class="sp"></span><span>'+money(x.v)+'</span></div><div class="track"><div class="fill" style="--c:var(--btn-bot);width:'+(x.v>0?Math.max(3,x.v/mx*100):0)+'%"></div></div></div>';
  }).join('')+'<div class="legend" style="color:var(--ink)">Heaviest stretch: '+esc(B.slice().sort(function(a,b){return b.v-a.v})[0].l.toLowerCase())+'. Bills without a due date are not included.</div></div>';
}

function chartSVG(all,hi,lo){
  var rows=all.slice(-12);
  var W=640,H=260,pL=10,pR=10,pT=30,pB=36;
  var max=Math.max.apply(null,rows.map(function(r){return r.total}))||1;
  var bw=(W-pL-pR)/rows.length,barW=Math.min(56,bw*0.64);
  var years={};rows.forEach(function(r){years[r.month.slice(0,4)]=1});
  var multi=Object.keys(years).length>1;
  var s='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Bar chart of total bills per month"><defs>'+
    grad('gB','var(--btn-top)','var(--btn-bot)')+grad('gO','#ffc266','#f08a00')+grad('gG','#7fe3a0','#1fa65a')+'</defs>';
  s+='<line x1="'+pL+'" x2="'+(W-pR)+'" y1="'+(H-pB)+'" y2="'+(H-pB)+'" style="stroke:var(--axis)" stroke-width="2"/>';
  rows.forEach(function(r,i){
    var h=Math.max(6,(r.total/max)*(H-pT-pB)),x=pL+i*bw+(bw-barW)/2,y=H-pB-h;
    var g='gB';if(all.length>1){if(r.month===hi.month)g='gO';else if(r.month===lo.month)g='gG'}
    s+='<rect x="'+x+'" y="'+y+'" width="'+barW+'" height="'+h+'" rx="12" fill="url(#'+g+')" style="stroke:var(--edge)" stroke-width="1.5"><title>'+esc(mTitle(r.month))+': '+money(r.total)+'</title></rect>';
    s+='<rect x="'+(x+4)+'" y="'+(y+4)+'" width="'+(barW-8)+'" height="'+Math.min(16,Math.max(0,h-8))+'" rx="7" fill="#fff" opacity=".38"/>';
    s+='<text x="'+(x+barW/2)+'" y="'+(y-8)+'" text-anchor="middle" font-size="12" font-weight="700" class="tv">'+money0(r.total)+'</text>';
    var lbl=mShort(r.month)+(multi?' ’'+r.month.slice(2,4):'');
    s+='<text x="'+(x+barW/2)+'" y="'+(H-pB+20)+'" text-anchor="middle" font-size="12" font-weight="600" class="ta">'+lbl+'</text>';
  });
  return s+'</svg>';
}

function saveBill(){
  var amt=parseAmt(modal.amount);
  if(!(amt>0)){document.getElementById('f-err').hidden=false;document.getElementById('f-amt').focus();return}
  function mk(id,month){var o={id:id,category:modal.category,amount:amt,note:modal.note,month:month};
    var nm=(modal.name||'').trim();if(nm)o.name=nm;if(modal.icon&&iconPath(modal.icon))o.icon=modal.icon;if(colorOK(modal.color))o.color=modal.color;
    if(modal.due&&DUE_RE.test(modal.due)){o.due=modal.due;if(repOK(modal.repeat))o.repeat=modal.repeat}return o}
  if(modal.editId){
    bills=bills.map(function(b){return b.id===modal.editId?mk(b.id,b.month):b});
  }else{
    bills.push(mk(uid(),modal.month));
  }
  save();closeModal();render();
}

function bulkFilled(){return CATS.map(function(c){return c.id}).filter(function(id){return parseAmt(modal.amounts[id])>0})}
function updateBulk(){
  var f=bulkFilled(),n=modal.months.length,count=n*f.length;
  var sum=f.reduce(function(s,id){return s+parseAmt(modal.amounts[id])},0)*n;
  document.getElementById('b-sum').textContent=count===0?'Pick at least one month and one amount.':'Adds '+count+' bills across '+n+(n===1?' month':' months')+' ('+money(sum)+' total)';
  var bad=CATS.some(function(c){return isNaN(dayVal(c.id))});
  document.getElementById('b-warn').hidden=!bad;
  document.getElementById('b-save').disabled=count===0||bad;
}
function dayVal(id){
  var s=String(modal.days[id]||'').trim();
  if(!s)return null;
  var n=parseInt(s,10);
  return (/^\d{1,2}$/.test(s)&&n>=1&&n<=31)?n:NaN;
}
function syncMonthChips(){
  Array.prototype.forEach.call($modal.querySelectorAll('.mchip'),function(el){
    var on=modal.months.indexOf(el.dataset.m)>=0;el.classList.toggle('on',on);el.setAttribute('aria-pressed',on);
  });
  updateBulk();
}
function saveBulk(){
  var f=bulkFilled();if(!f.length||!modal.months.length)return;
  var sel=modal.months.slice();
  var next=bills.slice();
  if(modal.replace)next=next.filter(function(b){return !(sel.indexOf(b.month)>=0&&f.indexOf(b.category)>=0)});
  sel.sort().forEach(function(m){f.forEach(function(id){
    var o={id:uid(),category:id,amount:parseAmt(modal.amounts[id]),note:'',month:m};
    if(id==='Other'&&modal.otherNote.trim())o.name=modal.otherNote.trim();
    var dv=dayVal(id);if(dv)o.due=m+'-'+pad(Math.min(dv,daysIn(m)));
    next.push(o);
  })});
  bills=next;save();closeModal();render();
}

var REM_KEY='billbubbles.rem.v1',REMSEEN_KEY='billbubbles.remseen.v1';
function loadRem(){try{var r=JSON.parse(localStorage.getItem(REM_KEY)||'{}');return {on:!!r.on,days:[0,1,3,7].indexOf(r.days)>=0?r.days:1,desktop:!!r.desktop,dismissed:typeof r.dismissed==='string'?r.dismissed:''}}catch(e){return {on:false,days:1,desktop:false,dismissed:''}}}
var rem=loadRem();

function addDaysStr(ds,n){var d=dDate(ds);d.setDate(d.getDate()+n);return ymd(d)}
function dueSoon(){
  if(!rem.on)return [];
  var t=todayStr(),last=addDaysStr(t,rem.days),out=[];
  bills.forEach(function(b){var d=nextDue(b,t);if(d&&d<=last)out.push({b:b,d:d})});
  return out.sort(function(x,y){return x.d<y.d?-1:x.d>y.d?1:0});
}
function whenWord(ds){var t=todayStr();return ds===t?'today':ds===addDaysStr(t,1)?'tomorrow':'on '+dShort(ds)}
function reminderBanner(){
  var list=dueSoon();
  if(!list.length||rem.dismissed===todayStr())return '';
  var first=list[0],more=list.length-1;
  var title=list.length===1?esc(billName(first.b))+' is due '+whenWord(first.d):list.length+' bills are due soon';
  var sub=list.length===1?money(first.b.amount):list.slice(0,3).map(function(x){return esc(billName(x.b))+' '+whenWord(x.d)}).join(' · ')+(more>2?' · +'+(more-2)+' more':'');
  return '<div class="remind" role="status"><svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true" style="color:var(--btn-bot)"><path fill="currentColor" d="M12 22a2 2 0 0 0 2-2h-4a2 2 0 0 0 2 2zm6-6V11a6 6 0 0 0-4.5-5.8V4.5a1.5 1.5 0 0 0-3 0v.7A6 6 0 0 0 6 11v5l-2 2v1h16v-1z"/></svg><div class="rb"><b>'+title+'</b><span class="s">'+sub+'</span></div><button class="x" data-act="rem-dismiss" aria-label="Dismiss reminder">&#10005;</button></div>';
}
function checkDesktopNotify(){
  if(!rem.on||!rem.desktop||!('Notification' in window)||Notification.permission!=='granted')return;
  var seen={};try{seen=JSON.parse(localStorage.getItem(REMSEEN_KEY)||'{}')}catch(e){}
  var t=todayStr(),changed=false;
  Object.keys(seen).forEach(function(k){if(seen[k]<t){delete seen[k];changed=true}});
  dueSoon().forEach(function(x){
    var k=x.b.id+'|'+x.d;if(seen[k])return;
    try{new Notification('Bill due '+whenWord(x.d),{body:billName(x.b)+' · '+money(x.b.amount)})}catch(e){return}
    seen[k]=x.d;changed=true;
  });
  if(changed){try{localStorage.setItem(REMSEEN_KEY,JSON.stringify(seen))}catch(e){}}
}

    '<p class="sum"><strong>In short:</strong> BillBubbles does not collect, send or share any of your information.</p>'+

    '<h4>What we do not do</h4><p>BillBubbles has no accounts, no analytics, no advertising and no third-party tracking tools. The app does not use the internet to send your data anywhere. It does not ask for access to your contacts, location, photos, camera or microphone. The only permission it can ask for is to show notifications, and only if you switch on bill reminders. Those reminders are created and shown on your device; nothing about them is sent to us or anyone else.</p>'+
    '<h4>Backups</h4><p>If you back up your device (for example to iCloud or to a computer), the app’s data may be included in that backup. That is controlled by your device settings and the backup provider’s own policies, not by us.</p>'+
    '<h4>Deleting your data</h4><p>You can delete any bill or tip entry inside the app. Deleting the app from your device removes all of its data.</p>'+
    '<h4>Children</h4><p>BillBubbles is not directed at children. Because the app collects no personal information from anyone, no information is collected from children either.</p>'+
    '<h4>Changes to this policy</h4><p>If this policy changes, the updated version will be posted on this page with a new effective date.</p>'+
    '<h4>Contact</h4><p>[DEVELOPER NAME]<br>[YOUR CONTACT EMAIL]</p></div>','Privacy policy');
}
function exportBackup(){
  var d=new Date();var name='billbubbles-backup-'+d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'.json';
  var json=JSON.stringify({app:'BillBubbles',version:2,exported:d.toISOString(),bills:bills,tips:tips},null,2);
  if(window.AndroidBridge&&window.AndroidBridge.saveFile){window.AndroidBridge.saveFile(name,json);return}
  var blob=new Blob([json],{type:'application/json'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(function(){URL.revokeObjectURL(a.href)},1500);
}
function importBackup(file){
  var r=new FileReader();
  r.onload=function(){
    var data;try{data=JSON.parse(r.result)}catch(e){alert('That file could not be read as a BillBubbles backup.');return}
    var arr=Array.isArray(data)?data:(data&&Array.isArray(data.bills)?data.bills:null);
    var ok=arr?arr.filter(validBill):[];
    var tp=(data&&!Array.isArray(data)&&Array.isArray(data.tips))?data.tips.filter(validTip).map(cleanTip):null;
    if(!ok.length){alert('No bills were found in that file.');return}
    if(!confirm('Replace your current bills with the '+ok.length+' bills in this backup'+(tp&&tp.length?' (and '+tp.length+' tip entries)':'')+'?'))return;
    bills=ok.map(clean);
    if(tp){tips=tp;saveTips()}
    save();closeModal();render();
  };
  r.readAsText(file);
}

/* ---------- events ---------- */
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-act]');
  var inAdd=e.target.closest('.addwrap');
  if(state.menu&&!inAdd){state.menu=false;render()}
  if(!t)return;
  var a=t.dataset.act;
  if(a==='overlay'){if(e.target===t)closeModal();return}
  if(a==='tab'){state.tab=t.dataset.tab;state.menu=false;render();window.scrollTo(0,0)}
  else if(a==='cal-prev'||a==='cal-next'){
    state.cal=addM(state.cal,a==='cal-prev'?-1:1);
    if(state.sel.slice(0,7)!==state.cal)state.sel=(todayStr().slice(0,7)===state.cal)?todayStr():state.cal+'-01';
    render();
  }
  else if(a==='cal-day'){state.sel=t.dataset.d;render()}
  else if(a==='cal-goto'){state.sel=t.dataset.d;state.cal=t.dataset.d.slice(0,7);render();window.scrollTo(0,0)}
  else if(a==='cal-add'){openBill(null,null,{due:state.sel,month:state.sel.slice(0,7)})}
  else if(a==='clear-due'){modal.due='';modal.repeat='';document.getElementById('f-due').value='';var r=document.getElementById('f-rep');r.value='';r.disabled=true}
  else if(a==='prev'){state.month=addM(state.month,-1);render()}
  else if(a==='next'){state.month=addM(state.month,1);render()}
  else if(a==='toggle-menu'){state.menu=!state.menu;render()}
  else if(a==='add-one'){state.menu=false;render();openBill(null,t.dataset.cat)}
  else if(a==='add-many'){state.menu=false;render();openBulk()}
  else if(a==='edit'){openBill(t.dataset.id)}
  else if(a==='delete'){e.stopPropagation();if(confirm('Delete this bill?')){bills=bills.filter(function(b){return b.id!==t.dataset.id});save();render()}}
  else if(a==='close'){closeModal()}
  else if(a==='pick-cat'){
    modal.category=t.dataset.cat;
    Array.prototype.forEach.call($modal.querySelectorAll('.chip'),function(el){var on=el.dataset.cat===modal.category;el.classList.toggle('on',on);el.setAttribute('aria-pressed',on)});
    var other=modal.category==='Other';
    document.getElementById('f-namel').textContent=other?'Name':'Custom name (optional)';
    document.getElementById('f-name').placeholder=other?'e.g. Internet, Phone':'e.g. Water bill';
    refreshIconPicker();
  }
  else if(a==='pick-icon'){modal.icon=t.dataset.icon||'';refreshIconPicker()}
  else if(a==='pick-color'){modal.color=t.dataset.color||'';refreshIconPicker()}
  else if(a==='save-bill'){saveBill()}
  else if(a==='bulk-month'){var i=modal.months.indexOf(t.dataset.m);if(i>=0)modal.months.splice(i,1);else modal.months.push(t.dataset.m);syncMonthChips()}
  else if(a==='bulk-last'){modal.months=monthOptions().slice(0,Number(t.dataset.n));syncMonthChips()}
  else if(a==='bulk-clear'){modal.months=[];syncMonthChips()}
  else if(a==='save-bulk'){saveBulk()}
  else if(a==='tip-prev'||a==='tip-next'){state.tcal=addM(state.tcal,a==='tip-next'?1:-1);state.tsel=state.tcal===curYM()?todayStr():state.tcal+'-01';render()}
  else if(a==='tip-day'){state.tsel=t.dataset.d;render()}
  else if(a==='tip-add'){openTip(null,state.tsel)}
  else if(a==='tip-edit'){openTip(t.dataset.id)}
  else if(a==='tip-delete'){e.stopPropagation();if(confirm('Delete these tips?')){tips=tips.filter(function(x){return x.id!==t.dataset.id});saveTips();render()}}
  else if(a==='save-tip'){saveTip()}
  else if(a==='backup'){openBackup()}
  else if(a==='privacy'){openPrivacy()}
  else if(a==='rem-dismiss'){rem.dismissed=todayStr();saveRem();renderBanner()}
  else if(a==='rem-days'){rem.days=+t.dataset.n;rem.dismissed='';saveRem();openStyle();renderBanner();checkDesktopNotify()}
  else if(a==='style'){openStyle()}
  else if(a==='set-mode'){styleState.mode=t.dataset.mode;saveStyle();applyStyle();openStyle()}
  else if(a==='set-theme'){styleState.theme=t.dataset.theme;saveStyle();applyStyle();openStyle()}
  else if(a==='export'){exportBackup()}
  else if(a==='import'){document.getElementById('b-file').click()}
});
document.addEventListener('change',function(e){if(modal&&modal.type==='bill'&&e.target.id==='f-rep')modal.repeat=e.target.value});
document.addEventListener('input',function(e){
  if(!modal)return;
  var el=e.target;
  if(modal.type==='tip'){
    if(el.id==='f-tamt'){modal.amount=el.value;updateTipCalc()}
    else if(el.id==='f-thrs'){modal.hours=el.value;updateTipCalc()}
    else if(el.id==='f-tdate'){modal.date=el.value}
    else if(el.id==='f-tnote'){modal.note=el.value}
    var te=document.getElementById('f-terr');if(te)te.hidden=true;
    return;
  }
  if(modal.type==='bill'){
    if(el.id==='f-amt'){modal.amount=el.value;document.getElementById('f-err').hidden=true}
    else if(el.id==='f-note'){modal.note=el.value}
    else if(el.id==='f-name'){modal.name=el.value}
    else if(el.id==='f-due'){modal.due=el.value;var r=document.getElementById('f-rep');r.disabled=!modal.due;if(!modal.due){modal.repeat='';r.value=''}}
  }else if(modal.type==='bulk'){
    if(el.dataset&&el.dataset.cat){modal.amounts[el.dataset.cat]=el.value;updateBulk()}
    else if(el.dataset&&el.dataset.day){modal.days[el.dataset.day]=el.value;updateBulk()}
    else if(el.id==='b-note'){modal.otherNote=el.value}
  }
});
document.addEventListener('change',function(e){
  if(!modal)return;
  if(modal.type==='bulk'&&e.target.id==='b-rep')modal.replace=e.target.checked;
  if(modal.type==='style'&&e.target.id==='rem-on'){rem.on=e.target.checked;rem.dismissed='';saveRem();openStyle();renderBanner();checkDesktopNotify();return}
  if(modal.type==='style'&&e.target.id==='rem-desk'){
    if(e.target.checked&&'Notification' in window){
      Notification.requestPermission().then(function(r){rem.desktop=(r==='granted');saveRem();openStyle();checkDesktopNotify()});
    }else{rem.desktop=false;saveRem()}
    return;
  }
  if(modal.type==='backup'&&e.target.id==='b-file'&&e.target.files[0]){importBackup(e.target.files[0]);e.target.value=''}
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){if(modal)closeModal();else if(state.menu){state.menu=false;render()}}
  if(e.key==='Enter'&&modal&&modal.type==='bill'&&e.target.tagName==='INPUT'){e.preventDefault();saveBill()}
});

})();

render();
