name: Build Android app for Amazon Appstore

# Runs when you upload to GitHub, or by hand from the Actions tab.
on:
  push:
  workflow_dispatch:

env:
  # Your app's permanent ID is  <APP_ORG>.billbubbles
  # Change APP_ORG BEFORE you publish anywhere. It cannot be changed afterwards.
  APP_ORG: io.github.mdetizen

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Install Android SDK pieces
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: Get the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "Using your saved signing key."
          else
            echo "::warning::No signing secrets found, so a temporary test key is used. Add the four ANDROID_* secrets before you upload to Amazon."
            keytool -genkeypair -keystore "$RUNNER_TEMP/release.jks" -storepass temp-pass-123 -keypass temp-pass-123 \
              -alias temp -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=BillBubbles test"
            KEYSTORE_PASSWORD=temp-pass-123; KEY_PASSWORD=temp-pass-123; KEY_ALIAS=temp
          fi
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build the APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Check the APK
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          ls -la "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs "$APK" | head -3
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$APK" | grep -E "package:|sdkVersion|uses-permission" || true

      - name: Save the APK
        uses: actions/upload-artifact@v4
        with:
          name: BillBubbles-android-apk
          path: app/build/outputs/apk/release/app-release.apk
